    /* Responsive container voor alleen de kaart */
    .map-container {
      position: relative;
      width: 100%;
      max-width: 800px; /* Pas eventueel de maximale breedte aan */
      height: 450px;     /* Pas de gewenste hoogte aan */
      margin: 20px auto;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .map-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>

<body>

  <!-- Uitsluitend het kaartkader -->
  <div class="map-container">
    <iframe 
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2511.9774653771966!2d5.689419!3d50.9905933!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47c0c56cfda4db6d%3A0xe5dd502ac7468d6e!2sPietie-Fun!5e0!3m2!1snl!2sbe!4v1710000000000!5m2!1snl!2sbe" 
      allowfullscreen="" 
      loading="lazy" 
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </div>


  <div class="form-container">
  <h2>Stuur ons een bericht</h2>

  <!-- Vul bij action jouw Formspree-link of verwerkingsscript in -->
  <form action="https://formspree.io/f/info@pietie-fun.be" method="POST">
    
    <!-- Naam (Verplicht) -->
    <div class="form-groep">
      <label for="naam">Naam *</label>
      <input type="text" id="naam" name="naam" required placeholder="Jouw volledige naam">
    </div>

    <!-- E-mailadres (Verplicht) -->
    <div class="form-groep">
      <label for="email">E-mailadres *</label>
      <input type="email" id="email" name="email" required placeholder="jouwnaam@gmail.com">
    </div>

    <!-- Telefoonnummer (Verplicht) -->
    <div class="form-groep">
      <label for="telefoon">Telefoonnummer *</label>
      <input type="tel" id="telefoon" name="telefoon" required placeholder="04.. .. .. ..">
    </div>

    <!-- Bericht (Verplicht) -->
    <div class="form-groep">
      <label for="bericht">Bericht *</label>
      <textarea id="bericht" name="bericht" rows="5" required placeholder="Typ hier je bericht..."></textarea>
    </div>

    <!-- Verzendknop -->
    <button type="submit" class="verzend-btn">Verstuur bericht</button>

  </form>
</div>
</body>
